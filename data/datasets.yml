datasets:
  turkiye_2023_engineering:
    region: Turkiye
    event: 2023 Kahramanmaras-Gaziantep earthquake sequence
    role: primary empirical vulnerability benchmark
    access: open
    license: CC-BY-4.0
    source_repository: maxandersonloake/TUR2023_02_06
    files:
      - Jaiswal_2023TurkiyeEQ_us6000jllz_field_str_damage_data.xlsx
      - ShakeMapUpd.xml.gz
    target: ordinal building damage state 0-4
    spatial_resolution: building coordinates
    status: ready

  nepal_2015_hrhrs:
    region: Nepal
    event: 2015 Gorkha earthquake
    role: large-scale second-region training/generalization
    access: public-use microdata subject to NSO terms
    redistribution: prohibited_without_written_agreement
    official_study_id: NPL-CBS-HRHRS-2016-v01
    target: building damage assessment / damage grade
    spatial_resolution: administrative/ward identifiers
    status: acquire_from_official_portal

  italy_dado:
    region: Italy
    event: multiple earthquakes
    role: third-region multi-event external generalization
    access: registration_required
    use: qualified_scientific_users
    target: harmonized observed damage grades
    spatial_resolution: georeferenced buildings / administrative location depending record
    status: planned

supporting:
  usgs_shakemap:
    role: ground_motion
  gem_global_exposure:
    role: exposure_and_replacement_value
  gem_global_vulnerability:
    role: conventional_fragility_vulnerability_baseline
  gem_geid:
    role: aggregate_event_validation
