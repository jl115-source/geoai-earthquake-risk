datasets:
  turkiye_2023_engineering:
    region: Turkiye
    event: 2023 Kahramanmaras-Gaziantep earthquake sequence
    role: primary empirical vulnerability benchmark
    access: open
    license: CC-BY-4.0
    source_repository: maxandersonloake/TUR2023_02_06
    files:
      survey:
        name: Jaiswal_2023TurkiyeEQ_us6000jllz_field_str_damage_data.xlsx
        storage: versioned_reference_and_local_raw
        expected_size_bytes: 218642
      shakemap:
        name: ShakeMapUpd.xml.gz
        storage: local_raw_only
        expected_size_bytes: 14980986
    target: ordinal building damage state 0-4
    n_survey_records: 559
    n_with_damage_and_structure: 527
    n_unique_coordinate_pairs: 499
    ingestion: python -m src.data.turkiye
    eda: python -m src.data.turkiye_eda
    schema_documentation: docs/turkiye_2023_columns.md
    spatial_resolution: building coordinates
    status: ready_via_make_data_core

  nepal_2015_geid_detailed:
    region: Nepal
    event: 2015 Gorkha earthquake
    role: core large-scale second-region damage dataset
    access: open_via_GEM_GEID
    license: CC-BY-NC-SA-4.0
    source_repository: gem/geid
    file: Impact_Buildings_Detailed.csv
    size_bytes: 78448526
    spatial_resolution: detailed_building_impact
    status: one_command_download_ready

  nepal_2015_hrhrs:
    region: Nepal
    event: 2015 Gorkha earthquake
    role: optional source/validation dataset and authoritative schema documentation
    access: public-use microdata subject to NSO terms
    redistribution: prohibited_without_written_agreement
    official_study_id: NPL-CBS-HRHRS-2016-v01
    target: building damage assessment / damage grade
    spatial_resolution: administrative/ward identifiers
    local_docs:
      - metadata JSON
      - English questionnaire
      - 14-district key-findings report
      - affected-districts map
    status: docs_one_command_download_microdata_manual_if_used

  multi_event_rc_616:
    region: multi-region
    events:
      - Erzincan_1992
      - Duzce_1999
      - Bingol_2003
      - Peru_2007
      - Wenchuan_2008
      - Haiti_2010
    role: open cross-event/cross-region engineering benchmark
    access: open
    license: CC-BY-SA-3.0
    source: datacenterhub
    doi: 10.7277/ACX0-DG18
    n_buildings: 616
    target: four-class structural damage
    spatial_resolution: building latitude_longitude_when_available
    status: one_command_download_ready

  italy_dado:
    region: Italy
    event: multiple earthquakes
    role: optional later external-generalization extension
    access: registration_required
    use: qualified_scientific_users
    target: harmonized observed damage grades
    spatial_resolution: georeferenced buildings / administrative location depending record
    status: deferred

supporting:
  usgs_shakemap:
    role: ground_motion
  gem_global_exposure:
    role: exposure_and_replacement_value
  gem_global_vulnerability:
    role: conventional_fragility_vulnerability_baseline
  gem_geid:
    role: aggregate_event_validation

  turkiye_2026_context:
    region: Turkiye
    event: 2023 Kahramanmaras earthquake sequence
    role: optional GeoAI spatial-context augmentation
    source: Zenodo
    doi: 10.5281/zenodo.18437501
    archive: 2023Turkey_earthquake_data.zip
    compressed_size_mb: 584.8
    md5: f3a3a9982cf63bd954616a898c7416b9
    includes:
      - building_footprints
      - multi_source_damage
      - DEM
      - epicentral_distance
      - fault_distance
      - lithology
      - PGV
    redistribution: local_only_due_to_unspecified_record_license
    status: one_command_download_ready
