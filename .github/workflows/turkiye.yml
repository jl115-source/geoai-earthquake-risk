name: Türkiye ingestion and validation
on: [push, pull_request]
jobs:
  turkiye:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-turkiye.txt
            requirements-audit.txt
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m src.data.turkiye
      - run: python -m src.data.turkiye_eda
      - run: python -m src.data.harmonize --datasets turkiye_survey
      - run: python -m src.data.design_experiments --datasets turkiye_survey
      - run: python -m src.risk.b0
      - run: python -m src.data.acquire_large_geoai noto
      - run: python -m src.data.audit_noto
      - run: python -m src.data.acquire_zagreb_copernicus
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: turkiye-2023-ingestion-eda
          path: |
            data/processed/turkiye_2023/
            results/turkiye_2023/
            results/noto_2024/
            docs/noto_2024/
            docs/noto_2024_execution.json
            docs/zagreb_2020_copernicus/
